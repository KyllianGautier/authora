name: Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: Release level
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: npm version ${{ inputs.level }} -m "release: %s"

      - name: Push version bump to develop
        run: git push origin develop --follow-tags

      - name: Merge develop into main
        run: |
          git checkout main
          git merge develop --no-ff -m "release: merge develop into main"
          git push origin main

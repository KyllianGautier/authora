name: CI

on:
  push:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:e2e

  build:
    runs-on: ubuntu-latest
    needs: [test, test-e2e]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist

  docs:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: authora
          POSTGRES_PASSWORD: authora
          POSTGRES_DB: authora_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - run: npm ci --omit=dev

      - name: Generate RSA keys
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out keys/private.pem
          openssl rsa -in keys/private.pem -pubout -out keys/public.pem

      - name: Start app and extract OpenAPI spec
        run: |
          node dist/src/main &
          APP_PID=$!
          sleep 3
          curl -sf http://localhost:3000/api-json -o openapi.json
          kill $APP_PID
        env:
          HOST: 127.0.0.1
          DB_USERNAME: authora
          DB_PASSWORD: authora
          RABBITMQ_URL: amqp://localhost:5672
          JWT_PRIVATE_KEY_PATH: ./keys/private.pem
          JWT_PUBLIC_KEY_PATH: ./keys/public.pem

      - name: Generate static HTML docs
        run: npx @redocly/cli build-docs openapi.json -o docs/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  docker:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker tags
        id: tags
        run: |
          IMAGE=${{ vars.DOCKERHUB_USERNAME }}/authora
          if [ "${{ github.ref_name }}" = "main" ]; then
            VERSION=$(node -p "require('./package.json').version")
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "tags=${IMAGE}:develop-${SHORT_SHA},${IMAGE}:develop" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Update Docker Hub description
        if: github.ref_name == 'main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/authora
          readme-filepath: DOCKERHUB.md
